version: "3.7"

services:
  nginx:
    container_name: pawsport-nginx
    image: "nginx:1.27-alpine"
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/pawsport/.cert:/etc/nginx/certs:ro
      - /etc/pawsport/certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name pawsport.ru;

          location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
          }

          location / {
            return 301 https://$$host$$request_uri;
          }
        }

        server {
          listen 443 ssl;
          http2 on;
          server_name pawsport.ru;

          ssl_certificate /etc/nginx/certs/fullchain.pem;
          ssl_certificate_key /etc/nginx/certs/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;

          location = /api {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
          }

          location /api/ {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
          }

          location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
          }
        }
        EOF
        nginx -g 'daemon off;'

  backend:
    container_name: pawsport-backend
    image: "cr.yandex/crpohuj0hvk9maacnvvo/pawsport-backend:latest"
    restart: always
    expose:
      - "4000"
    env_file:
      - /etc/pawsport/backend.env
    environment:
      GOTENBERG_URL: "http://gotenberg:3000"
    depends_on:
      - gotenberg

  gotenberg:
    container_name: pawsport-gotenberg
    image: gotenberg/gotenberg:8
    restart: always
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--chromium-deny-list=^(?!file:///).*"
      - "--chromium-disable-javascript=true"
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    container_name: pawsport-frontend
    image: "cr.yandex/crpohuj0hvk9maacnvvo/pawsport-frontend:latest"
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    depends_on:
      - backend
